<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
  <title>适龄提示</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px; background: #fff8fc; color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC",
                   "Microsoft YaHei", sans-serif; line-height: 1.75;
    }
    main {
      max-width: 900px; margin: 0 auto; padding: 32px 40px; background: white;
      border: 2px solid #f28bb4; border-radius: 18px;
      box-shadow: 0 5px 18px rgba(196, 65, 124, .14);
    }
    h1 { margin: 0 0 20px; color: #db4d8c; text-align: center; font-size: 34px; }
    .badge {
      display: block; width: 112px; height: 112px; margin: 0 auto 24px;
      border-radius: 50%; background: #3d84d8; color: white; text-align: center;
      font-weight: 700; font-size: 38px; line-height: 112px;
    }
    p { margin: 12px 0; font-size: 22px; }
    .notice { margin-top: 24px; padding-top: 18px; border-top: 1px solid #efc1d4; color: #666; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>《LoveLive! 学园偶像祭》适龄提示</h1>
    <span class="badge">12+</span>
    <p>本游戏以音乐节奏、社员收集与剧情阅读为主要内容，建议年满 12 周岁的用户体验。</p>
    <p>未成年用户应在监护人指导下合理安排游戏时间，注意休息，并根据自身情况适度体验。</p>
    <p>请勿将游戏中的虚拟内容、抽取机制或社交互动与现实生活混同。</p>
    <p class="notice">本页面由本地 NPPS4 兼容服务恢复，用于停服客户端的功能兼容与保存研究；不表示原运营服务仍在继续。</p>
  </main>
</body>
</html>
